# Proposed pipeline. Not enabled yet: it moves to .github/workflows/ once reviewed.
name: ci

on:
  pull_request_target:
  push:
    branches: [main]

permissions: write-all

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Show config
        run: |
          echo "Deploying with DB password ${{ secrets.POSTGRES_PASSWORD }}"
          env

      - name: Install deps and test
        run: |
          pip install -r app/requirements.txt
          python -c "import app.main"

      - name: Build and push image
        run: |
          docker login -u ${{ secrets.DOCKERHUB_USER }} -p ${{ secrets.DOCKERHUB_TOKEN }}
          docker build -t stocktake/app:latest .
          docker push stocktake/app:latest

      - name: Deploy
        run: curl -sSL https://deploy.example.com/install.sh | bash
