services:
  app:
    build: .
    env_file: .env
    environment:
      DB_HOST: localhost
      REDIS_URL: redis://cache:6379/0
    depends_on:
      - db
      - cache
    # Mounted so we can add a /stats/containers endpoint later.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true

  db:
    image: postgres:latest
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb/init.sql

  cache:
    image: redis:latest
    ports:
      - "6379:6379"

  proxy:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

volumes:
  pgdata:
